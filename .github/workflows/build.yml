name: Build Music Clone

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEOS: /home/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos, iOS toolchain and SDK
        run: |
          # Official Theos installer: installs dependencies, Theos, and the Linux iOS toolchain
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          # iOS 10.3 SDK: new enough to build, and still supports 32-bit armv7 + iOS 8 target
          "$THEOS/bin/install-sdk" iPhoneOS10.3
          ls "$THEOS/sdks"
          ls "$THEOS/toolchain" || true

      - name: Install ldid (app signing tool)
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          if ! command -v ldid >/dev/null && [ ! -x "$THEOS/bin/ldid" ]; then
            sudo curl -fsSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            sudo chmod +x /usr/local/bin/ldid
          fi
          command -v ldid || ls "$THEOS/bin"

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Check app contents
        run: |
          ls -la Resources
          find .theos/_ -type f | head -40
          APP=$(find .theos/_ -maxdepth 4 -name '*.app' | head -1)
          test -f "$APP/Info.plist" || { echo "ERROR: Info.plist is missing from $APP"; exit 1; }
          test -f "$APP/MusicClone" || { echo "ERROR: executable is missing from $APP"; exit 1; }

      - name: Make IPA
        run: |
          APP=$(find .theos/_ -maxdepth 4 -name '*.app' | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -r "$APP" Payload/
          zip -qry MusicClone.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MusicClone
          path: |
            MusicClone.ipa
            packages/*.deb
