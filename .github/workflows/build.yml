name: Build Music Clone

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git curl perl rsync zip unzip xz-utils libplist-utils dpkg

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS toolchain (Linux clang + ld64)
        run: |
          mkdir -p "$HOME/theos/toolchain"
          curl -fsSL -o /tmp/toolchain.tar.xz https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain.tar.xz
          tar -xf /tmp/toolchain.tar.xz -C "$HOME/theos/toolchain"
          ls "$HOME/theos/toolchain" "$HOME/theos/toolchain"/* | head -40

      - name: Install iOS SDKs
        run: |
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Install ldid (signing)
        run: |
          sudo curl -fsSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Make IPA
        run: |
          APP=$(find .theos/_ -maxdepth 4 -name '*.app' | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -r "$APP" Payload/
          zip -qry MusicClone.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MusicClone
          path: |
            MusicClone.ipa
            packages/*.deb
